<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Bitácora de limpieza | Refugio NELARY</title>
  <link rel="icon" type="image/png" href="logo-nelary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde: #22412F;
      --verde-claro: #3B6A4D;
      --crema: #F3EBD9;
      --crema-suave: #F9F4E8;
      --crema-oscuro: #E0D1B0;
      --dorado: #B8924A;
      --dorado-oscuro: #8A6A30;
      --texto: #1E1E1E;
      --gris: #6B6558;
      --blanco: #FFFFFF;
      --rojo: #7A3228;
      --rojo-fondo: #F6E9E4;
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans: "Inter", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      font-weight: 300;
      background: var(--crema-suave);
      color: var(--texto);
      line-height: 1.55;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2 {
      font-family: var(--serif);
      font-weight: 500;
      color: var(--verde);
      line-height: 1.15;
    }

    button, input, select, textarea { font-family: inherit; }

    [hidden] { display: none !important; }

    header {
      background: var(--verde);
      color: var(--crema);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    header img { height: 32px; width: auto; }

    .titulo {
      font-family: var(--serif);
      font-size: 1.1rem;
      letter-spacing: 0.5px;
    }

    .btn-salir {
      background: transparent;
      color: var(--crema);
      border: 1px solid rgba(243, 235, 217, 0.5);
      padding: 7px 12px;
      font-size: 0.66rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .contenedor {
      max-width: 560px;
      margin: 0 auto;
      padding: 26px 18px 60px;
    }

    .login { margin-top: 40px; }
    .login h1 { font-size: 1.9rem; margin-bottom: 18px; }

    form { display: grid; gap: 20px; }

    label {
      display: block;
      font-size: 0.64rem;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--verde-claro);
      margin-bottom: 2px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px 0;
      border: none;
      border-bottom: 1px solid var(--crema-oscuro);
      background: transparent;
      font-size: 1rem;
      color: var(--texto);
      border-radius: 0;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      background-image: linear-gradient(45deg, transparent 50%, var(--dorado) 50%), linear-gradient(135deg, var(--dorado) 50%, transparent 50%);
      background-position: right 8px center, right 2px center;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 24px;
    }

    textarea { resize: vertical; min-height: 70px; }

    input:focus, select:focus, textarea:focus { outline: none; border-bottom-color: var(--dorado); }

    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .btn {
      background: var(--verde);
      color: var(--blanco);
      border: none;
      padding: 16px;
      font-size: 0.74rem;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) { background: var(--verde-claro); }
    .btn:disabled { opacity: 0.6; cursor: wait; }

    .error-texto { color: var(--rojo); font-size: 0.9rem; min-height: 1.2em; }

    .mensaje {
      padding: 14px 16px;
      background: var(--crema);
      color: var(--verde);
      font-family: var(--serif);
      font-size: 1.05rem;
      font-style: italic;
    }

    .mensaje.error { background: var(--rojo-fondo); color: var(--rojo); }

    .historial { margin-top: 40px; }
    .historial h2 { font-size: 1.5rem; margin-bottom: 14px; }

    .item {
      background: var(--blanco);
      border: 1px solid var(--crema-oscuro);
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.7rem;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--dorado-oscuro);
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .item p { font-size: 0.95rem; }
    .item .nota { color: var(--gris); font-style: italic; font-size: 0.88rem; }

    .pendiente { color: var(--rojo); }

    .vacio {
      text-align: center;
      color: var(--gris);
      padding: 24px 0;
      font-family: var(--serif);
      font-size: 1.1rem;
      font-style: italic;
    }

    @media (max-width: 480px) {
      .fila { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:12px;">
      <img src="logo-nelary.png" alt="NELARY">
      <span class="titulo">Bitácora de limpieza</span>
    </div>
    <button type="button" class="btn-salir" id="btn-salir" hidden>Salir</button>
  </header>

  <!-- LOGIN -->
  <section class="contenedor login" id="pantalla-login" hidden>
    <h1>Ingreso</h1>
    <form id="form-login">
      <div>
        <label for="correo">Correo</label>
        <input type="email" id="correo" required autocomplete="username">
      </div>
      <div>
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" required autocomplete="current-password">
      </div>
      <p class="error-texto" id="error-login"></p>
      <button type="submit" class="btn" id="boton-login">Entrar</button>
    </form>
  </section>

  <!-- REPORTES -->
  <main class="contenedor" id="pantalla-panel" hidden>
    <h1>Reportar</h1>
    <form id="form-bitacora" style="margin-top: 18px;">
      <div class="fila">
        <div>
          <label for="cabana">Cabaña</label>
          <select id="cabana" required>
            <option value="">Seleccione</option>
            <option value="Cabaña Grande">Cabaña Grande</option>
            <option value="Cabina Pequeña">Cabina Pequeña</option>
          </select>
        </div>
        <div>
          <label for="tipo">Tipo de reporte</label>
          <select id="tipo" required>
            <option value="consumo">Consumo / uso</option>
            <option value="reposicion">Necesita reposición</option>
            <option value="faltante">Faltante</option>
            <option value="dano">Daño</option>
            <option value="extravio">Extraviado</option>
          </select>
        </div>
      </div>

      <div>
        <label for="producto">Producto</label>
        <input type="text" id="producto" list="lista-productos" required minlength="2" maxlength="120" autocomplete="off">
        <datalist id="lista-productos"></datalist>
      </div>

      <div>
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" required min="1" max="1000" step="1" inputmode="numeric">
      </div>

      <div>
        <label for="nota">Observación (opcional)</label>
        <textarea id="nota" maxlength="500"></textarea>
      </div>

      <button type="submit" class="btn" id="boton-guardar">Guardar reporte</button>
      <div class="mensaje" id="mensaje" role="status" hidden></div>
    </form>

    <section class="historial">
      <h2>Mis últimos reportes</h2>
      <div id="historial"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      initializeFirestore,
      getFirestore,
      persistentLocalCache,
      persistentMultipleTabManager,
      collection,
      doc,
      getDoc,
      getDocs,
      query,
      where,
      limit,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    /* =========================================================
       FIREBASE
       ========================================================= */
    const firebaseConfig = {
      apiKey: "AIzaSyB0ubNo_ojBiATkTB5RNMP_OZkOodmvQnM",
      authDomain: "cabinas-nelary.firebaseapp.com",
      projectId: "cabinas-nelary",
      storageBucket: "cabinas-nelary.firebasestorage.app",
      messagingSenderId: "946760081226",
      appId: "1:946760081226:web:466a4d1be01425f272abb3"
    };

    const app = initializeApp(firebaseConfig);

    // Caché local: permite guardar reportes aunque no haya internet
    let db;
    try {
      db = initializeFirestore(app, {
        localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
      });
    } catch (error) {
      console.warn("Sin caché sin conexión:", error);
      db = getFirestore(app);
    }

    const auth = getAuth(app);

    /* =========================================================
       ELEMENTOS Y ESTADO
       ========================================================= */
    const pantallaLogin = document.getElementById("pantalla-login");
    const pantallaPanel = document.getElementById("pantalla-panel");
    const btnSalir = document.getElementById("btn-salir");
    const formLogin = document.getElementById("form-login");
    const botonLogin = document.getElementById("boton-login");
    const errorLogin = document.getElementById("error-login");
    const formBitacora = document.getElementById("form-bitacora");
    const cabanaInput = document.getElementById("cabana");
    const tipoInput = document.getElementById("tipo");
    const productoInput = document.getElementById("producto");
    const cantidadInput = document.getElementById("cantidad");
    const notaInput = document.getElementById("nota");
    const listaProductos = document.getElementById("lista-productos");
    const mensaje = document.getElementById("mensaje");
    const historial = document.getElementById("historial");

    let usuario = null;
    let productos = [];

    const etiquetasTipo = {
      consumo: "Consumo / uso",
      reposicion: "Necesita reposición",
      faltante: "Faltante",
      dano: "Daño",
      extravio: "Extraviado"
    };

    /* =========================================================
       UTILIDADES
       ========================================================= */
    function esc(texto) {
      return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatoFecha(ms) {
      return new Date(ms).toLocaleString("es-CR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    }

    function mostrarMensaje(texto, esError) {
      mensaje.textContent = texto;
      mensaje.classList.toggle("error", !!esError);
      mensaje.hidden = false;
    }

    /* =========================================================
       LOGIN Y ACCESO
       ========================================================= */
    formLogin.addEventListener("submit", async function (e) {
      e.preventDefault();
      errorLogin.textContent = "";
      botonLogin.disabled = true;
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("correo").value.trim(),
          document.getElementById("clave").value
        );
      } catch (error) {
        console.error(error);
        errorLogin.textContent = "Correo o contraseña incorrectos.";
      } finally {
        botonLogin.disabled = false;
      }
    });

    btnSalir.addEventListener("click", function () {
      signOut(auth);
    });

    async function tieneAcceso(uid) {
      try {
        const snap = await getDoc(doc(db, "staff", uid));
        return snap.exists() && snap.data().rol === "limpieza";
      } catch (error) {
        console.error(error);
        return false;
      }
    }

    onAuthStateChanged(auth, async function (user) {
      usuario = user;

      if (!user) {
        pantallaPanel.hidden = true;
        btnSalir.hidden = true;
        pantallaLogin.hidden = false;
        return;
      }

      const acceso = await tieneAcceso(user.uid);
      if (!acceso) {
        errorLogin.textContent = "Esta cuenta no tiene acceso a la bitácora.";
        await signOut(auth);
        return;
      }

      pantallaLogin.hidden = true;
      pantallaPanel.hidden = false;
      btnSalir.hidden = false;

      await cargarProductos();
      cargarHistorial();
    });

    /* =========================================================
       PRODUCTOS (sugerencias según la cabaña)
       ========================================================= */
    async function cargarProductos() {
      try {
        const snap = await getDocs(collection(db, "inventario"));
        productos = snap.docs.map(function (d) { return d.data(); });
        actualizarSugerencias();
      } catch (error) {
        console.error(error);
      }
    }

    function actualizarSugerencias() {
      const cabana = cabanaInput.value;
      const nombres = [...new Set(
        productos
          .filter(function (p) { return !cabana || p.cabana === cabana; })
          .map(function (p) { return p.producto; })
      )].sort();

      listaProductos.innerHTML = nombres.map(function (n) {
        return '<option value="' + esc(n) + '"></option>';
      }).join("");
    }

    cabanaInput.addEventListener("change", actualizarSugerencias);

    /* =========================================================
       HISTORIAL DEL USUARIO
       ========================================================= */
    async function cargarHistorial() {
      if (!usuario) return;
      historial.innerHTML = '<p class="vacio">Cargando…</p>';

      try {
        const snap = await getDocs(
          query(collection(db, "bitacora"), where("creadoPor", "==", usuario.uid), limit(50))
        );

        const items = snap.docs.map(function (d) {
          const data = d.data();
          return {
            cabana: data.cabana,
            tipo: data.tipo,
            producto: data.producto,
            cantidad: data.cantidad,
            nota: data.nota,
            pendiente: d.metadata.hasPendingWrites,
            ms: data.creadoEn && data.creadoEn.toMillis ? data.creadoEn.toMillis() : Date.now()
          };
        });

        items.sort(function (a, b) { return b.ms - a.ms; });

        historial.innerHTML = items.length
          ? items.map(tarjetaHistorial).join("")
          : '<p class="vacio">Aún no hay reportes.</p>';
      } catch (error) {
        console.error(error);
        historial.innerHTML = '<p class="vacio">No pudimos cargar el historial.</p>';
      }
    }

    function tarjetaHistorial(i) {
      const fecha = i.pendiente
        ? '<span class="pendiente">Pendiente de envío</span>'
        : esc(formatoFecha(i.ms));

      return '<article class="item">' +
        '<div class="item-top"><span>' + esc(i.cabana) + "</span><span>" + fecha + "</span></div>" +
        "<p><strong>" + esc(etiquetasTipo[i.tipo] || i.tipo) + "</strong> · " +
          esc(i.producto) + " × " + esc(i.cantidad) + "</p>" +
        (i.nota ? '<p class="nota">' + esc(i.nota) + "</p>" : "") +
      "</article>";
    }

    /* =========================================================
       GUARDAR REPORTE
       Se muestra de inmediato; si no hay internet, Firebase lo
       envía cuando vuelva la conexión.
       ========================================================= */
    formBitacora.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!usuario) return;

      const datos = {
        cabana: cabanaInput.value,
        tipo: tipoInput.value,
        producto: productoInput.value.trim(),
        cantidad: Number(cantidadInput.value),
        nota: notaInput.value.trim(),
        creadoPor: usuario.uid,
        creadoEn: serverTimestamp()
      };

      const referencia = doc(collection(db, "bitacora"));
      setDoc(referencia, datos).catch(function (error) {
        console.error(error);
        mostrarMensaje("No se pudo guardar el reporte. Avise a la administración.", true);
      });

      const sinConexion = !navigator.onLine;
      mostrarMensaje(
        sinConexion
          ? "Sin conexión: el reporte quedó guardado y se enviará al recuperar la señal."
          : "Reporte guardado. Gracias."
      );

      formBitacora.reset();
      tipoInput.value = "consumo";
      actualizarSugerencias();
      cargarHistorial();
    });
  </script>

</body>
</html>
