<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración | Refugio NELARY</title>
  <link rel="icon" type="image/png" href="logo-nelary.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --verde: #22412F;
      --verde-claro: #3B6A4D;
      --crema: #F3EBD9;
      --crema-suave: #F9F4E8;
      --crema-oscuro: #E0D1B0;
      --dorado: #B8924A;
      --dorado-oscuro: #8A6A30;
      --texto: #1E1E1E;
      --gris: #6B6558;
      --blanco: #FFFFFF;
      --rojo: #7A3228;
      --rojo-fondo: #F6E9E4;
      --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
      --sans: "Inter", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      font-weight: 300;
      background: var(--crema-suave);
      color: var(--texto);
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: var(--serif);
      font-weight: 500;
      color: var(--verde);
      line-height: 1.15;
    }

    button, input, select, textarea { font-family: inherit; }

    [hidden] { display: none !important; }

    /* ---------- CABECERA ---------- */
    header {
      background: var(--verde);
      color: var(--crema);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    header img { height: 36px; width: auto; }

    header .titulo {
      font-family: var(--serif);
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    .btn-salir {
      background: transparent;
      color: var(--crema);
      border: 1px solid rgba(243, 235, 217, 0.5);
      padding: 8px 14px;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* ---------- LOGIN ---------- */
    .login {
      max-width: 400px;
      margin: 60px auto;
      padding: 0 22px;
    }

    .login h1 { font-size: 2rem; margin-bottom: 8px; }
    .ayuda { color: var(--gris); font-size: 0.9rem; }

    form { display: grid; gap: 22px; }

    label {
      display: block;
      font-size: 0.66rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--verde-claro);
      margin-bottom: 4px;
      font-weight: 500;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 0;
      border: none;
      border-bottom: 1px solid var(--crema-oscuro);
      background: transparent;
      font-size: 1rem;
      color: var(--texto);
      border-radius: 0;
    }

    textarea { resize: vertical; min-height: 70px; }

    input:focus, select:focus, textarea:focus { outline: none; border-bottom-color: var(--dorado); }

    .btn {
      background: var(--verde);
      color: var(--blanco);
      border: none;
      padding: 16px;
      font-size: 0.74rem;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
    }

    .btn:hover:not(:disabled) { background: var(--verde-claro); }
    .btn:disabled { opacity: 0.6; cursor: wait; }

    .error-texto {
      color: var(--rojo);
      font-size: 0.9rem;
      min-height: 1.2em;
    }

    /* ---------- PANEL ---------- */
    .panel {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px 22px 60px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--crema-oscuro);
      margin-bottom: 26px;
      overflow-x: auto;
    }

    .tab {
      background: none;
      border: none;
      padding: 12px 18px;
      font-size: 0.72rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gris);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }

    .tab.activo {
      color: var(--verde);
      border-bottom-color: var(--dorado);
    }

    .barra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .barra h1 { font-size: 1.9rem; }

    .barra .controles { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .barra select {
      width: auto;
      min-width: 160px;
      padding: 10px 26px 10px 0;
      border-bottom: 1px solid var(--dorado);
      cursor: pointer;
    }

    .btn-nueva {
      background: var(--verde);
      color: var(--blanco);
      border: none;
      padding: 12px 18px;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-nueva:hover { background: var(--verde-claro); }

    .formulario {
      background: var(--blanco);
      border: 1px solid var(--dorado);
      padding: 26px 24px;
      margin-bottom: 26px;
    }

    .formulario h2 { font-size: 1.5rem; margin-bottom: 18px; }

    .fila2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .acciones-form { display: flex; gap: 12px; flex-wrap: wrap; }

    .acciones-form button {
      padding: 14px 20px;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid var(--verde);
      background: var(--verde);
      color: var(--blanco);
    }

    .acciones-form button.sec {
      background: transparent;
      color: var(--verde);
    }

    .acciones-form button:disabled { opacity: 0.5; cursor: wait; }

    .tarjeta {
      background: var(--blanco);
      border: 1px solid var(--crema-oscuro);
      padding: 22px 24px;
      margin-bottom: 16px;
    }

    .t-cab {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .cab {
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--dorado-oscuro);
    }

    .estado {
      font-size: 0.66rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1px solid currentColor;
    }

    .estado.nueva { color: var(--dorado-oscuro); background: #F8F1DE; }
    .estado.confirmada { color: var(--verde); background: #E4EDE6; }
    .estado.completada { color: var(--verde-claro); background: #EEF4EF; }
    .estado.bloqueada { color: var(--gris); background: #ECE7DC; }
    .estado.rechazada, .estado.cancelada { color: var(--rojo); background: var(--rojo-fondo); }

    .tarjeta h3 { font-size: 1.5rem; margin-bottom: 6px; }

    .fechas { color: var(--verde); font-size: 0.95rem; margin-bottom: 6px; }

    .resumen-pago {
      font-size: 0.9rem;
      color: var(--verde);
      margin: 6px 0 4px;
      padding: 8px 12px;
      background: var(--crema-suave);
      border-left: 2px solid var(--dorado);
    }

    .contacto { font-size: 0.9rem; color: var(--gris); margin-bottom: 6px; word-break: break-word; }
    .contacto a { color: var(--verde-claro); }

    .notas {
      font-size: 0.9rem;
      color: var(--gris);
      font-style: italic;
      margin-top: 8px;
      padding-left: 12px;
      border-left: 2px solid var(--crema-oscuro);
    }

    .acciones {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .acciones button {
      padding: 12px 18px;
      font-size: 0.7rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--verde);
      background: var(--verde);
      color: var(--blanco);
    }

    .acciones button.sec {
      background: transparent;
      color: var(--rojo);
      border-color: var(--rojo);
    }

    .acciones button:disabled { opacity: 0.5; cursor: wait; }

    .historial-box { margin-top: 14px; }

    .historial {
      list-style: none;
      border-top: 1px solid var(--crema-oscuro);
      padding-top: 8px;
      font-size: 0.85rem;
      color: var(--gris);
    }

    .historial li {
      padding: 6px 0;
      border-bottom: 1px dotted var(--crema-oscuro);
    }

    .pago-form {
      display: grid;
      gap: 16px;
      margin-top: 14px;
    }

    .fotos {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .fotos img {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border: 1px solid var(--crema-oscuro);
    }

    .vacio {
      text-align: center;
      color: var(--gris);
      padding: 40px 0;
      font-family: var(--serif);
      font-size: 1.2rem;
      font-style: italic;
    }

    .vacio.error { color: var(--rojo); }

    @media (max-width: 640px) {
      .fila2 { grid-template-columns: 1fr; }
      .barra select { min-width: 0; }
    }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:14px;">
      <img src="logo-nelary.png" alt="NELARY">
      <span class="titulo">Administración</span>
    </div>
    <button type="button" class="btn-salir" id="btn-salir" hidden>Cerrar sesión</button>
  </header>

  <!-- LOGIN -->
  <section class="login" id="pantalla-login" hidden>
    <h1>Ingreso</h1>
    <p class="ayuda" style="margin-bottom:28px;">Solo para la administración del refugio.</p>
    <form id="form-login">
      <div>
        <label for="correo">Correo</label>
        <input type="email" id="correo" required autocomplete="username">
      </div>
      <div>
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" required autocomplete="current-password">
      </div>
      <p class="error-texto" id="error-login"></p>
      <button type="submit" class="btn" id="boton-login">Entrar</button>
    </form>
  </section>

  <!-- PANEL -->
  <main class="panel" id="pantalla-panel" hidden>
    <nav class="tabs">
      <button type="button" class="tab activo" data-tab="reservas">Reservas</button>
      <button type="button" class="tab" data-tab="bitacora">Bitácora de limpieza</button>
      <button type="button" class="tab" data-tab="ajustes">Datos de pago</button>
    </nav>

    <!-- VISTA RESERVAS -->
    <section id="vista-reservas">
      <div class="barra">
        <h1>Reservas</h1>
        <div class="controles">
          <select id="filtro" aria-label="Filtrar por estado">
            <option value="nueva">Nuevas</option>
            <option value="confirmada">Confirmadas</option>
            <option value="completada">Completadas</option>
            <option value="bloqueada">Bloqueos</option>
            <option value="cancelada">Canceladas</option>
            <option value="rechazada">Rechazadas</option>
            <option value="todas">Todas</option>
          </select>
          <button type="button" class="btn-nueva" id="btn-nueva">+ Nueva reserva</button>
        </div>
      </div>

      <section class="formulario" id="formulario" hidden>
        <h2 id="form-titulo">Nueva reserva</h2>
        <form id="form-reserva">
          <input type="hidden" id="f-id">
          <div class="fila2">
            <div>
              <label for="f-tipo">Tipo</label>
              <select id="f-tipo">
                <option value="confirmada">Reserva confirmada</option>
                <option value="nueva">Solicitud pendiente</option>
                <option value="bloqueada">Bloqueo (mantenimiento o uso personal)</option>
              </select>
            </div>
            <div>
              <label for="f-canal">Canal de procedencia</label>
              <select id="f-canal">
                <option value="directa">Directa / teléfono</option>
                <option value="airbnb">Airbnb</option>
                <option value="booking">Booking</option>
                <option value="expedia">Expedia</option>
                <option value="web">Web propia</option>
                <option value="otro">Otro</option>
              </select>
            </div>
          </div>
          <div class="fila2">
            <div>
              <label for="f-cabana">Cabaña</label>
              <select id="f-cabana">
                <option value="">Seleccione</option>
                <option value="Cabaña Grande">Cabaña Grande</option>
                <option value="Cabina Pequeña">Cabina Pequeña</option>
              </select>
            </div>
            <div>
              <label for="f-personas">Personas</label>
              <input type="number" id="f-personas" min="1" max="8" value="2">
            </div>
          </div>
          <div class="fila2">
            <div>
              <label for="f-entrada">Entrada</label>
              <input type="date" id="f-entrada">
            </div>
            <div>
              <label for="f-salida">Salida</label>
              <input type="date" id="f-salida">
            </div>
          </div>
          <div class="fila2">
            <div>
              <label for="f-nombre">Nombre</label>
              <input type="text" id="f-nombre" maxlength="120">
            </div>
            <div>
              <label for="f-telefono">Teléfono</label>
              <input type="tel" id="f-telefono" maxlength="30">
            </div>
          </div>
          <div>
            <label for="f-correo">Correo (opcional)</label>
            <input type="email" id="f-correo" maxlength="120">
          </div>
          <div>
            <label for="f-notas">Notas</label>
            <textarea id="f-notas" maxlength="1000"></textarea>
          </div>
          <p class="error-texto" id="error-form"></p>
          <div class="acciones-form">
            <button type="submit" id="boton-guardar">Guardar</button>
            <button type="button" class="sec" id="boton-cerrar-form">Cerrar</button>
          </div>
        </form>
      </section>

      <div id="lista"></div>
    </section>

    <!-- VISTA BITÁCORA -->
    <section id="vista-bitacora" hidden>
      <div class="barra">
        <h1>Bitácora de limpieza</h1>
        <div class="controles">
          <select id="filtro-cabana" aria-label="Filtrar por cabaña">
            <option value="todas">Todas las cabañas</option>
            <option value="Cabaña Grande">Cabaña Grande</option>
            <option value="Cabina Pequeña">Cabina Pequeña</option>
          </select>
          <select id="filtro-tipo" aria-label="Filtrar por tipo">
            <option value="todos">Todos los tipos</option>
            <option value="consumo">Consumo</option>
            <option value="reposicion">Reposición</option>
            <option value="faltante">Faltante</option>
            <option value="dano">Daño</option>
            <option value="extravio">Extravío</option>
          </select>
          <button type="button" class="btn-nueva" id="btn-actualizar-bitacora">Actualizar</button>
        </div>
      </div>
      <div id="lista-bitacora"></div>
    </section>

    <!-- VISTA DATOS DE PAGO -->
    <section id="vista-ajustes" hidden>
      <div class="barra">
        <h1>Datos de pago</h1>
      </div>
      <p class="ayuda">Este texto aparece en los correos de confirmación y de recordatorio de saldo. Puede cambiarlo cuando quiera. Escriba cuentas BAC, IBAN y SINPE, una por línea.</p>
      <form id="form-ajustes" class="formulario">
        <label for="ajustes-texto">Datos para el pago</label>
        <textarea id="ajustes-texto" rows="8" maxlength="1000"></textarea>
        <p class="error-texto" id="ajustes-mensaje"></p>
        <button type="submit" class="btn" id="btn-guardar-ajustes">Guardar datos de pago</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      setDoc,
      getDocs,
      addDoc,
      deleteDoc,
      query,
      where,
      orderBy,
      limit,
      runTransaction,
      writeBatch,
      serverTimestamp,
      updateDoc,
      arrayUnion,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    /* =========================================================
       FIREBASE
       ========================================================= */
    const firebaseConfig = {
      apiKey: "AIzaSyB0ubNo_ojBiATkTB5RNMP_OZkOodmvQnM",
      authDomain: "cabinas-nelary.firebaseapp.com",
      projectId: "cabinas-nelary",
      storageBucket: "cabinas-nelary.firebasestorage.app",
      messagingSenderId: "946760081226",
      appId: "1:946760081226:web:466a4d1be01425f272abb3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    /* =========================================================
       CONFIGURACIÓN DE CORREO Y PAGOS
       Reemplace los marcadores con los valores de EmailJS y del refugio.
       Mientras estén los marcadores, los correos no se envían.
       ========================================================= */
    const EMAILJS = {
      servicio: "PEGAR_SERVICE_ID",
      plantilla: "PEGAR_TEMPLATE_ID",
      clave: "PEGAR_PUBLIC_KEY"
    };
    const CORREO_REFUGIO = "PEGAR_CORREO_DEL_REFUGIO";
    // Se reemplaza con lo guardado en Firestore (config/datosPago) al entrar al panel
    let DATOS_PAGO = "[Completar: cuenta SINPE o transferencia]";
    const METODOS_PAGO = ["Transferencia", "SINPE Móvil", "Efectivo", "Tarjeta", "Otro"];

    const MAX_PERSONAS = { "Cabaña Grande": 8, "Cabina Pequeña": 2 };
    const ETIQUETAS_ESTADO = {
      nueva: "Nueva",
      confirmada: "Confirmada",
      completada: "Completada",
      bloqueada: "Bloqueada",
      cancelada: "Cancelada",
      rechazada: "Rechazada"
    };
    const ETIQUETAS_CANAL = {
      web: "Web propia",
      directa: "Directa / teléfono",
      airbnb: "Airbnb",
      booking: "Booking",
      expedia: "Expedia",
      otro: "Otro"
    };
    const TIPOS = {
      consumo: "Consumo",
      reposicion: "Reposición",
      faltante: "Faltante",
      dano: "Daño",
      extravio: "Extravío"
    };

    /* =========================================================
       ELEMENTOS
       ========================================================= */
    const pantallaLogin = document.getElementById("pantalla-login");
    const pantallaPanel = document.getElementById("pantalla-panel");
    const btnSalir = document.getElementById("btn-salir");
    const formLogin = document.getElementById("form-login");
    const botonLogin = document.getElementById("boton-login");
    const errorLogin = document.getElementById("error-login");

    const vistaReservas = document.getElementById("vista-reservas");
    const vistaBitacora = document.getElementById("vista-bitacora");
    const vistaAjustes = document.getElementById("vista-ajustes");
    const formAjustes = document.getElementById("form-ajustes");
    const ajustesTexto = document.getElementById("ajustes-texto");
    const ajustesMensaje = document.getElementById("ajustes-mensaje");
    const btnGuardarAjustes = document.getElementById("btn-guardar-ajustes");
    const filtro = document.getElementById("filtro");
    const lista = document.getElementById("lista");
    const btnNueva = document.getElementById("btn-nueva");

    const formulario = document.getElementById("formulario");
    const formTitulo = document.getElementById("form-titulo");
    const formReserva = document.getElementById("form-reserva");
    const fId = document.getElementById("f-id");
    const fTipo = document.getElementById("f-tipo");
    const fCanal = document.getElementById("f-canal");
    const fCabana = document.getElementById("f-cabana");
    const fPersonas = document.getElementById("f-personas");
    const fEntrada = document.getElementById("f-entrada");
    const fSalida = document.getElementById("f-salida");
    const fNombre = document.getElementById("f-nombre");
    const fTelefono = document.getElementById("f-telefono");
    const fCorreo = document.getElementById("f-correo");
    const fNotas = document.getElementById("f-notas");
    const errorForm = document.getElementById("error-form");
    const botonGuardar = document.getElementById("boton-guardar");

    const filtroCabana = document.getElementById("filtro-cabana");
    const filtroTipo = document.getElementById("filtro-tipo");
    const listaBitacora = document.getElementById("lista-bitacora");
    const btnActualizarBitacora = document.getElementById("btn-actualizar-bitacora");

    let solicitudes = [];
    let reportes = [];
    let personal = {};

    /* =========================================================
       UTILIDADES
       ========================================================= */
    function esc(texto) {
      return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fechaDesdeTexto(texto) {
      const p = texto.split("-").map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    }

    function textoDesdeFecha(d) {
      const mes = String(d.getMonth() + 1).padStart(2, "0");
      const dia = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + mes + "-" + dia;
    }

    // Noches de la estadía: desde la entrada hasta el día anterior a la salida
    function listaNoches(entrada, salida) {
      const noches = [];
      const d = fechaDesdeTexto(entrada);
      const fin = fechaDesdeTexto(salida);
      while (d < fin) {
        noches.push(textoDesdeFecha(d));
        d.setDate(d.getDate() + 1);
      }
      return noches;
    }

    // Identificador fijo de cada noche: impide guardar dos veces la misma noche
    function claveBloqueo(cabana, fecha) {
      return cabana + "_" + fecha;
    }

    function estaVencido(b) {
      return b.estado === "pendiente" &&
        !!b.expiraEn &&
        typeof b.expiraEn.toMillis === "function" &&
        b.expiraEn.toMillis() < Date.now();
    }

    // Las solicitudes nuevas bloquean 48 horas; lo confirmado o bloqueado queda fijo
    function camposHold(estado) {
      if (estado === "nueva") {
        return {
          estado: "pendiente",
          expiraEn: Timestamp.fromMillis(Date.now() + 48 * 60 * 60 * 1000)
        };
      }
      return { estado: "reservado" };
    }

    function formatoLargo(texto) {
      return fechaDesdeTexto(texto).toLocaleDateString("es-CR", { day: "numeric", month: "short", year: "numeric" });
    }

    function fechaHora(ts) {
      return ts && typeof ts.toDate === "function"
        ? ts.toDate().toLocaleString("es-CR", { dateStyle: "short", timeStyle: "short" })
        : "";
    }

    function milisegundos(ts) {
      return ts && typeof ts.toMillis === "function" ? ts.toMillis() : 0;
    }

    function soloDigitos(texto) {
      return String(texto || "").replace(/\D/g, "");
    }

    function miniatura(url) {
      return url.indexOf("/upload/") !== -1
        ? url.replace("/upload/", "/upload/c_fill,w_240,h_240/")
        : url;
    }

    function fmtColones(n) {
      return "₡" + Number(n || 0).toLocaleString("es-CR");
    }

    /* =========================================================
       PAGOS
       El total se guarda en "precioTotal". Los pagos se guardan
       en el arreglo "pagos" de la solicitud.
       ========================================================= */
    function resumenPago(s) {
      const total = Number(s.precioTotal || 0);
      const pagado = (s.pagos || []).reduce(function (suma, p) {
        return suma + Number(p.monto || 0);
      }, 0);
      const saldo = Math.max(total - pagado, 0);
      let estado = "pendiente";
      if (total > 0 && pagado >= total) estado = "completo";
      else if (pagado > 0) estado = "parcial";
      return { total: total, pagado: pagado, saldo: saldo, estado: estado };
    }

    /* =========================================================
       CORREOS (EmailJS)
       ========================================================= */
    // Abre el correo del celular o computadora con el mensaje ya escrito.
    // El administrador revisa y toca "Enviar". No necesita EmailJS.
    function enviarCorreo(para, asunto, mensaje) {
      if (!para) return Promise.resolve(false);
      try {
        window.location.href =
          "mailto:" + encodeURIComponent(para) +
          "?subject=" + encodeURIComponent(asunto) +
          "&body=" + encodeURIComponent(mensaje);
        return Promise.resolve(true);
      } catch (error) {
        console.warn("No se pudo abrir el correo:", error);
        return Promise.resolve(false);
      }
    }

    function resumenEstadia(d) {
      return "Cabaña: " + d.cabana + "\n" +
        "Entrada: " + formatoLargo(d.entrada) + "\n" +
        "Salida: " + formatoLargo(d.salida) + "\n" +
        "Personas: " + d.personas + "\n";
    }

    function textoConfirmacion(d) {
      let texto = "Hola " + d.nombre + ".\n\nSu reserva en Refugio NELARY está confirmada.\n\n" + resumenEstadia(d);
      if (Number(d.precioTotal) > 0) {
        const adelanto = Math.round(Number(d.precioTotal) * 0.5);
        texto += "\nTotal: " + fmtColones(d.precioTotal) +
          "\nAdelanto (50 %): " + fmtColones(adelanto) +
          "\n\nDatos para el pago: " + DATOS_PAGO + "\n";
      }
      return texto + "\nGracias por elegirnos.\nRefugio NELARY";
    }

    function textoCambio(d) {
      return "Hola " + d.nombre + ".\n\nSu reserva en Refugio NELARY fue modificada.\n\n" +
        resumenEstadia(d) + "\nSi tiene alguna duda, responda a este correo.\n\nRefugio NELARY";
    }

    function textoCancelacion(s) {
      return "Hola " + s.nombre + ".\n\nSu reserva en Refugio NELARY fue cancelada.\n\n" +
        resumenEstadia(s) + "\nSi tiene alguna duda, responda a este correo.\n\nRefugio NELARY";
    }

    function textoRechazo(s) {
      return "Hola " + s.nombre + ".\n\nLamentamos informarle que no pudimos confirmar su solicitud para estas fechas.\n\n" +
        resumenEstadia(s) + "\nSi desea, puede escribirnos para buscar otras fechas.\n\nRefugio NELARY";
    }

    function textoPago(s, monto, metodo) {
      const r = resumenPago(s);
      return "Hola " + s.nombre + ".\n\nRecibimos su pago de " + fmtColones(monto) + " (" + metodo + ").\n\n" +
        "Total de la estadía: " + fmtColones(r.total) + "\n" +
        "Pagado hasta hoy: " + fmtColones(r.pagado) + "\n" +
        "Saldo pendiente: " + fmtColones(r.saldo) + "\n\nGracias.\nRefugio NELARY";
    }

    function textoRecordatorio(s) {
      const r = resumenPago(s);
      return "Hola " + s.nombre + ".\n\nLe recordamos que tiene un saldo pendiente de " + fmtColones(r.saldo) +
        " para su estadía del " + formatoLargo(s.entrada) + ".\n\n" +
        "Datos para el pago: " + DATOS_PAGO + "\n\nRefugio NELARY";
    }

    /* =========================================================

      try {
        const snapshot = await getDocs(query(collection(db, "solicitudes"), orderBy("creadoEn", "desc")));

          return Object.assign({ id: d.id }, d.data());

        render();
      } catch (error) {

    function botonesDe(s) {
      const id = esc(s.id);
      function boton(accion, texto, secundario) {
        return '<button type="button" ' + (secundario ? 'class="sec" ' : "") +
          'data-accion="' + accion + '" data-id="' + id + '">' + texto + "</button>";
      }

      let html = "";
      if (s.estado === "nueva") {
        html += boton("confirmar", "Confirmar") + boton("rechazar", "Rechazar", true) + boton("editar", "Editar", true);
      } else if (s.estado === "confirmada") {
        html += boton("editar", "Editar", true) + boton("completar", "Marcar completada") + boton("cancelar", "Cancelar reserva", true);
      } else if (s.estado === "bloqueada") {
        html += boton("editar", "Editar", true) + boton("cancelar", "Quitar bloqueo", true);
      }
      html += boton("pagos", "Pagos", true) + boton("historial", "Historial", true) + boton("eliminar", "Eliminar", true);
      return html;
    }

    function tarjetaDe(s) {
      const noches = listaNoches(s.entrada, s.salida);
      const tel = soloDigitos(s.telefono);
      const numeroWa = tel.length === 8 ? "506" + tel : tel;
      const partes = [];
      if (s.telefono) partes.push('<a href="tel:' + esc(s.telefono) + '">' + esc(s.telefono) + "</a>");
      if (s.correo) partes.push('<a href="mailto:' + esc(s.correo) + '">' + esc(s.correo) + "</a>");
      if (tel) partes.push('<a href="https://wa.me/' + esc(numeroWa) + '" target="_blank" rel="noopener">WhatsApp</a>');

      const r = resumenPago(s);
      const resumen = Number(s.precioTotal) > 0
        ? '<p class="resumen-pago">Total ' + fmtColones(r.total) + " · Pagado " + fmtColones(r.pagado) +
          " · Saldo " + fmtColones(r.saldo) + " · " + r.estado + "</p>"
        : "";

      return '<article class="tarjeta">' +
        '<div class="t-cab">' +
          '<span class="cab">' + esc(s.cabana) + " · " + esc(ETIQUETAS_CANAL[s.canal] || "Web propia") + "</span>" +
          '<span class="estado ' + esc(s.estado) + '">' + esc(ETIQUETAS_ESTADO[s.estado] || s.estado) + "</span>" +
        "</div>" +
        "<h3>" + esc(s.nombre) + "</h3>" +
        '<p class="fechas">' + formatoLargo(s.entrada) + " → " + formatoLargo(s.salida) +
          " · " + noches.length + (noches.length === 1 ? " noche" : " noches") +
          " · " + esc(s.personas) + " personas</p>" +
        (partes.length ? '<p class="contacto">' + partes.join(" · ") + "</p>" : "") +
        (s.notas ? '<p class="notas">' + esc(s.notas) + "</p>" : "") +
        resumen +
        '<div class="acciones">' + botonesDe(s) + "</div>" +
        '<div class="historial-box" data-historial="' + esc(s.id) + '" hidden></div>' +
        '<div class="historial-box" data-pagos="' + esc(s.id) + '" hidden></div>' +
      "</article>";
    }

    function render() {
      const estado = filtro.value;
      const visibles = solicitudes.filter(function (s) {
        return estado === "todas" || s.estado === estado;

        lista.innerHTML = '<p class="vacio">No hay reservas en este estado.</p>';
        return;
      }

      lista.innerHTML = visibles.map(tarjetaDe).join("");
    }

    /* =========================================================
       FORMULARIO: NUEVA RESERVA Y EDICIÓN
       ========================================================= */
    function mostrarError(texto) {

    function abrirFormulario(s) {

      if (s) {
        formTitulo.textContent = "Editar reserva";

      } else {

    }

    btnNueva.addEventListener("click", function () { abrirFormulario(null); });
    document.getElementById("boton-cerrar-form").addEventListener("click", cerrarFormulario);

    function leerFormulario() {
      const cabana = fCabana.value;
      const entrada = fEntrada.value;
      const salida = fSalida.value;
      const personas = Number(fPersonas.value);
      const nombre = fNombre.value.trim();

      if (!cabana) { mostrarError("Elija una cabaña."); return null; }
      if (!entrada || !salida) { mostrarError("Indique la entrada y la salida."); return null; }
      if (salida <= entrada) { mostrarError("La salida debe ser posterior a la entrada."); return null; }
      if (!personas || personas < 1 || personas > MAX_PERSONAS[cabana]) {
        mostrarError("La cantidad de personas no es válida para esa cabaña (máximo " + MAX_PERSONAS[cabana] + ").");
        return null;
      }
      if (!nombre) { mostrarError("Escriba un nombre."); return null; }

      return {
        id: fId.value || null,
        cabana: cabana,
        entrada: entrada,
        salida: salida,
        personas: personas,
        nombre: nombre,
        telefono: fTelefono.value.trim(),
        correo: fCorreo.value.trim(),
        notas: fNotas.value.trim(),
        estado: fTipo.value,
        canal: fCanal.value
      };
    }

    formReserva.addEventListener("submit", async function (e) {
      e.preventDefault();
      errorForm.textContent = "";
      const datos = leerFormulario();
      if (!datos) return;

      botonGuardar.disabled = true;
      try {
        await guardarReserva(datos, datos.id ? "Editada" : "Creada");
        cerrarFormulario();
        await cargarSolicitudes();
      } catch (error) {
        console.error(error);
        mostrarError(error.message === "CONFLICTO"
          ? "Alguna de esas noches ya está ocupada para esta cabaña."
          : "No se pudo guardar. Intente de nuevo.");
      } finally {
        botonGuardar.disabled = false;
      }
    });

    /* =========================================================
       GUARDAR RESERVA (nueva, editada o confirmada)
       Todas las noches se revisan y se escriben dentro de una
       transacción: si una noche ya está ocupada, no se guarda nada.
       ========================================================= */
    async function guardarReserva(datos, accion) {
      const noches = listaNoches(datos.entrada, datos.salida);
      const sRef = datos.id ? doc(db, "solicitudes", datos.id) : doc(collection(db, "solicitudes"));
      const solicitudId = sRef.id;

      // Revisión adicional de bloqueos antiguos (con identificador aleatorio)
      const todos = await getDocs(collection(db, "bloqueos"));
      const choqueAntiguo = todos.docs.some(function (d) {
        const b = d.data();
        return b.cabana === datos.cabana &&
          b.solicitudId !== solicitudId &&
          noches.indexOf(b.fecha) !== -1 &&
          !estaVencido(b);
      });
      if (choqueAntiguo) throw new Error("CONFLICTO");

      const anteriores = datos.id
        ? todos.docs.filter(function (d) { return d.data().solicitudId === datos.id; }).map(function (d) { return d.ref; })
        : [];

      const refs = noches.map(function (f) {
        return doc(db, "bloqueos", claveBloqueo(datos.cabana, f));
      });
      const hold = camposHold(datos.estado);

      await runTransaction(db, async function (tx) {
        const snaps = [];
        for (const r of refs) {
          snaps.push(await tx.get(r));
        }

        const ocupada = snaps.some(function (s) {
          return s.exists() && s.data().solicitudId !== solicitudId && !estaVencido(s.data());
        });
        if (ocupada) throw new Error("CONFLICTO");

        anteriores.forEach(function (r) {
          if (!refs.some(function (x) { return x.path === r.path; })) tx.delete(r);
        });

        refs.forEach(function (r, i) {
          tx.set(r, Object.assign({
            cabana: datos.cabana,
            fecha: noches[i],
            solicitudId: solicitudId,
            creadoEn: serverTimestamp()
          }, hold));
        });

        const campos = {
          cabana: datos.cabana,
          entrada: datos.entrada,
          salida: datos.salida,
          personas: datos.personas,
          nombre: datos.nombre,
          telefono: datos.telefono,
          correo: datos.correo,
          notas: datos.notas,
          estado: datos.estado,
          canal: datos.canal
        };
        if (!datos.id) campos.creadoEn = serverTimestamp();
        tx.set(sRef, campos, { merge: true });
      });

      await registrarHistorial(solicitudId, accion, datos.cabana + " · " + datos.entrada + " → " + datos.salida + " · " + datos.personas + " personas");

      // Correos al huésped
      if (datos.correo && datos.estado === "confirmada") {
        if (accion === "Confirmada") {
          await enviarCorreo(datos.correo, "Reserva confirmada · Refugio NELARY", textoConfirmacion(datos));
        } else if (accion === "Editada") {
          await enviarCorreo(datos.correo, "Cambio en su reserva · Refugio NELARY", textoCambio(datos));
        }
      }
    }

    function datosDeSolicitud(s, estado) {
      return {
        id: s.id,
        cabana: s.cabana,
        entrada: s.entrada,
        salida: s.salida,
        personas: s.personas,
        nombre: s.nombre,
        telefono: s.telefono || "",
        correo: s.correo || "",
        notas: s.notas || "",
        canal: s.canal || "web",
        precioTotal: s.precioTotal || 0,
        estado: estado
      };
    }

    /* =========================================================
       ACCIONES SOBRE CADA RESERVA
       ========================================================= */
    lista.addEventListener("click", async function (e) {
      const boton = e.target.closest("button[data-accion]");
      if (!boton) return;

      const s = solicitudes.find(function (x) { return x.id === boton.dataset.id; });
      if (!s) return;

      const accion = boton.dataset.accion;

      if (accion === "editar") {
        abrirFormulario(s);
        return;
      }
      if (accion === "historial") {
        alternarHistorial(s, boton);
        return;
      }
      if (accion === "pagos") {
        alternarPagos(s, boton);
        return;
      }

      const caja = boton.closest(".historial-box");

      if (accion === "guardar-precio") {
        await guardarPrecio(s, caja, boton);
        return;
      }
      if (accion === "registrar-pago") {
        await registrarPago(s, caja, boton);
        return;
      }
      if (accion === "recordar-saldo") {
        await recordarSaldo(s, boton);
        return;
      }

      boton.disabled = true;
      try {
        if (accion === "confirmar") await confirmar(s);
        if (accion === "rechazar") await cambiarEstado(s, "rechazada", "¿Rechazar la solicitud de " + s.nombre + "? Las noches quedarán disponibles.", true);
        if (accion === "cancelar") await cambiarEstado(s, "cancelada", "¿Cancelar la reserva de " + s.nombre + "? Las noches quedarán disponibles.", true);
        if (accion === "completar") await cambiarEstado(s, "completada", "¿Marcar la estadía de " + s.nombre + " como completada?", false);
        if (accion === "eliminar") await eliminar(s);
        await cargarSolicitudes();
      } catch (error) {
        console.error(error);
        alert(error.message === "CONFLICTO"
          ? "Alguna de esas noches ya está ocupada. Revise el calendario."
          : "No se pudo completar la acción. Intente de nuevo.");
        boton.disabled = false;
      }
    });

    async function confirmar(s) {
      if (!confirm("¿Confirmar la reserva de " + s.nombre + "?")) return;
      await guardarReserva(datosDeSolicitud(s, "confirmada"), "Confirmada");
    }

    async function cambiarEstado(s, estado, pregunta, liberarNoches) {
      if (!confirm(pregunta)) return;

      const batch = writeBatch(db);
      if (liberarNoches) {
        const bloqueos = await getDocs(query(collection(db, "bloqueos"), where("solicitudId", "==", s.id)));
        bloqueos.docs.forEach(function (d) { batch.delete(d.ref); });
      }
      batch.update(doc(db, "solicitudes", s.id), { estado: estado });
      await batch.commit();

      await registrarHistorial(s.id, ETIQUETAS_ESTADO[estado], "Estado cambiado a " + ETIQUETAS_ESTADO[estado].toLowerCase());

      if (s.correo) {
        if (estado === "cancelada") {
          await enviarCorreo(s.correo, "Reserva cancelada · Refugio NELARY", textoCancelacion(s));
        } else if (estado === "rechazada") {
          await enviarCorreo(s.correo, "Solicitud de reserva · Refugio NELARY", textoRechazo(s));
        }
      }
    }

    async function eliminar(s) {
      if (!confirm("¿Eliminar la solicitud de " + s.nombre + " y liberar sus fechas? No se puede deshacer.")) return;

      await registrarHistorial(s.id, "Eliminada", s.cabana + " · " + s.entrada + " → " + s.salida);

      const bloqueos = await getDocs(query(collection(db, "bloqueos"), where("solicitudId", "==", s.id)));
      const batch = writeBatch(db);
      bloqueos.docs.forEach(function (d) { batch.delete(d.ref); });
      batch.delete(doc(db, "solicitudes", s.id));
      await batch.commit();
    }

    async function alternarHistorial(s, boton) {
      const contenedor = lista.querySelector('[data-historial="' + s.id + '"]');
      if (!contenedor) return;

      if (!contenedor.hidden) {
        contenedor.hidden = true;
        boton.textContent = "Historial";
        return;
      }

      contenedor.hidden = false;
      boton.textContent = "Ocultar historial";
      contenedor.innerHTML = '<p class="vacio">Cargando…</p>';

      try {
        const snap = await getDocs(query(collection(db, "historial"), where("solicitudId", "==", s.id)));
        const items = snap.docs.map(function (d) { return d.data(); })
          .sort(function (a, b) { return milisegundos(b.creadoEn) - milisegundos(a.creadoEn); });

        contenedor.innerHTML = items.length
          ? '<ul class="historial">' + items.map(function (i) {
              return "<li><strong>" + esc(i.accion) + "</strong> · " + esc(i.detalle) +
                " · " + esc(i.usuario) + " · " + esc(fechaHora(i.creadoEn)) + "</li>";
            }).join("") + "</ul>"
          : '<p class="ayuda">Sin movimientos registrados.</p>';
      } catch (error) {
        console.error(error);
        contenedor.innerHTML = '<p class="vacio error">No pudimos cargar el historial.</p>';
      }
    }

    /* =========================================================
       PAGOS: VISTA, PRECIO, REGISTRO Y RECORDATORIOS
       ========================================================= */
    function alternarPagos(s, boton) {
      const caja = lista.querySelector('[data-pagos="' + s.id + '"]');
      if (!caja) return;

      if (!caja.hidden) {
        caja.hidden = true;
        boton.textContent = "Pagos";
        return;
      }

      caja.hidden = false;
      boton.textContent = "Ocultar pagos";
      renderPagos(s, caja);
    }

    function renderPagos(s, caja) {
      const r = resumenPago(s);
      const opciones = METODOS_PAGO.map(function (m) {
        return '<option value="' + esc(m) + '">' + esc(m) + "</option>";
      }).join("");
      const pagos = (s.pagos || []).map(function (p) {
        return "<li><strong>" + esc(fmtColones(p.monto)) + "</strong> · " + esc(p.metodo) +
          (p.referencia ? " · ref. " + esc(p.referencia) : "") +
          " · " + esc(fechaHora(p.fecha)) + "</li>";
      }).join("");

      const puedeRecordar = r.saldo > 0 && s.correo && s.estado === "confirmada";

      caja.innerHTML =
        '<div class="resumen-pago">Total ' + fmtColones(r.total) + " · Pagado " + fmtColones(r.pagado) +
          " · Saldo " + fmtColones(r.saldo) + " · " + esc(r.estado) + "</div>" +
        (pagos ? '<ul class="historial">' + pagos + "</ul>" : '<p class="ayuda">Sin pagos registrados.</p>') +
        '<div class="pago-form">' +
          '<div class="fila2">' +
            "<div>" +
              '<label>Precio total (₡)</label>' +
              '<input type="number" min="0" data-precio value="' + esc(r.total) + '">' +
            "</div>" +
            '<div class="acciones"><button type="button" data-accion="guardar-precio" data-id="' + esc(s.id) + '">Guardar precio</button></div>' +
          "</div>" +
          '<div class="fila2">' +
            "<div>" +
              '<label>Monto recibido (₡)</label>' +
              '<input type="number" min="1" data-monto>' +
            "</div>" +
            "<div>" +
              '<label>Método</label>' +
              '<select data-metodo>' + opciones + "</select>" +
            "</div>" +
          "</div>" +
          '<div class="fila2">' +
            "<div>" +
              '<label>Referencia (opcional)</label>' +
              '<input type="text" data-referencia maxlength="80">' +
            "</div>" +
            '<div class="acciones"><button type="button" data-accion="registrar-pago" data-id="' + esc(s.id) + '">Registrar pago</button></div>' +
          "</div>" +
        "</div>" +
        (puedeRecordar
          ? '<div class="acciones"><button type="button" class="sec" data-accion="recordar-saldo" data-id="' + esc(s.id) + '">Enviar recordatorio de saldo</button></div>'
          : "");
    }

    async function guardarPrecio(s, caja, boton) {
      const valor = Number(caja.querySelector("[data-precio]").value);
      if (!(valor >= 0)) {
        alert("Escriba un precio válido.");
        return;
      }

      boton.disabled = true;
      try {
        await updateDoc(doc(db, "solicitudes", s.id), { precioTotal: valor });
        s.precioTotal = valor;
        await registrarHistorial(s.id, "Precio actualizado", fmtColones(valor));
        renderPagos(s, caja);
        render();
        alternarPagosAbierto(s);
      } catch (error) {
        console.error(error);
        alert("No se pudo guardar el precio. Intente de nuevo.");
        boton.disabled = false;
      }
    }

    async function registrarPago(s, caja, boton) {
      const monto = Number(caja.querySelector("[data-monto]").value);
      const metodo = caja.querySelector("[data-metodo]").value;
      const referencia = caja.querySelector("[data-referencia]").value.trim();

      if (!(monto > 0)) {
        alert("Escriba el monto recibido.");
        return;
      }

      const pago = { monto: monto, metodo: metodo, referencia: referencia, fecha: Timestamp.now() };

      boton.disabled = true;
      try {
        await updateDoc(doc(db, "solicitudes", s.id), { pagos: arrayUnion(pago) });
        s.pagos = (s.pagos || []).concat([pago]);
        await registrarHistorial(s.id, "Pago registrado", fmtColones(monto) + " · " + metodo + (referencia ? " · ref. " + referencia : ""));

        const enviado = s.correo
          ? await enviarCorreo(s.correo, "Pago recibido · Refugio NELARY", textoPago(s, monto, metodo))
          : false;
        if (s.correo && !enviado) {
          alert("El pago quedó registrado, pero el correo no se pudo enviar.");
        }

        renderPagos(s, caja);
        render();
        alternarPagosAbierto(s);
      } catch (error) {
        console.error(error);
        alert("No se pudo registrar el pago. Intente de nuevo.");
      } finally {
        boton.disabled = false;
      }
    }

    async function recordarSaldo(s, boton) {
      boton.disabled = true;
      const enviado = await enviarCorreo(s.correo, "Recordatorio de saldo · Refugio NELARY", textoRecordatorio(s));
      alert(enviado ? "Recordatorio enviado." : "No se pudo enviar el recordatorio. Revise la configuración de correo.");
      boton.disabled = false;
    }

    // Vuelve a dejar abierta la caja de pagos después de re-dibujar la lista
    function alternarPagosAbierto(s) {
      const caja = lista.querySelector('[data-pagos="' + s.id + '"]');
      if (!caja) return;
      caja.hidden = false;
      renderPagos(s, caja);
      const boton = lista.querySelector('button[data-accion="pagos"][data-id="' + s.id + '"]');
      if (boton) boton.textContent = "Ocultar pagos";
    }

    /* =========================================================
       BITÁCORA DE LIMPIEZA
       ========================================================= */
    async function cargarBitacora() {
      listaBitacora.innerHTML = '<p class="vacio">Cargando…</p>';
      try {
        const [bitacora, personalSnap] = await Promise.all([
          getDocs(query(collection(db, "bitacora"), orderBy("creadoEn", "desc"), limit(100))),
          getDocs(collection(db, "staff"))
        ]);

        personal = {};
        personalSnap.forEach(function (d) {
          personal[d.id] = d.data().nombre || "";
        });

        reportes = bitacora.docs.map(function (d) {
          return Object.assign({ id: d.id }, d.data());
        });
        renderBitacora();
      } catch (error) {
        console.error(error);
        listaBitacora.innerHTML = '<p class="vacio error">No pudimos cargar la bitácora. Revise que su cuenta esté autorizada.</p>';
      }
    }

    function tarjetaBitacora(r) {
      const fotos = (r.fotos || []).map(function (url) {
        return '<a href="' + esc(url) + '" target="_blank" rel="noopener"><img src="' + esc(miniatura(url)) + '" alt="Foto del reporte"></a>';
      }).join("");

      const cantidad = r.cantidad !== undefined && r.cantidad !== "" ? "Cantidad: " + esc(r.cantidad) + " · " : "";

      return '<article class="tarjeta">' +
        '<div class="t-cab">' +
          '<span class="cab">' + esc(r.cabana) + "</span>" +
          '<span class="estado">' + esc(TIPOS[r.tipo] || r.tipo) + "</span>" +
        "</div>" +
        "<h3>" + esc(r.producto || "Sin producto") + "</h3>" +
        '<p class="fechas">' + cantidad + esc(fechaHora(r.creadoEn)) + " · " + esc(personal[r.creadoPor] || "Personal") + "</p>" +
        (r.nota ? '<p class="notas">' + esc(r.nota) + "</p>" : "") +
        (fotos ? '<div class="fotos">' + fotos + "</div>" : "") +
        '<div class="acciones"><button type="button" class="sec" data-borrar-reporte="' + esc(r.id) + '">Eliminar reporte</button></div>' +
      "</article>";
    }

    function renderBitacora() {
      const cabana = filtroCabana.value;
      const tipo = filtroTipo.value;
      const visibles = reportes.filter(function (r) {
        return (cabana === "todas" || r.cabana === cabana) &&
               (tipo === "todos" || r.tipo === tipo);
      });

      if (visibles.length === 0) {
        listaBitacora.innerHTML = '<p class="vacio">No hay reportes con estos filtros.</p>';
        return;
      }

      listaBitacora.innerHTML = visibles.map(tarjetaBitacora).join("");
    }

    filtroCabana.addEventListener("change", renderBitacora);
    filtroTipo.addEventListener("change", renderBitacora);
    btnActualizarBitacora.addEventListener("click", cargarBitacora);

    listaBitacora.addEventListener("click", async function (e) {
      const boton = e.target.closest("button[data-borrar-reporte]");
      if (!boton) return;
      if (!confirm("¿Eliminar este reporte de la bitácora? Las fotos quedan en Cloudinary.")) return;

      boton.disabled = true;
      try {
        await deleteDoc(doc(db, "bitacora", boton.dataset.borrarReporte));
        await cargarBitacora();
      } catch (error) {
        console.error(error);
        alert("No se pudo eliminar el reporte. Intente de nuevo.");
        boton.disabled = false;
      }
    });
  </script>

</body>
